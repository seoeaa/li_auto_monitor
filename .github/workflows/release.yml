name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: Android
            artifact_path: build/app/outputs/flutter-apk/app-release.apk
            asset_name: app-release.apk
          - os: macos-latest
            target: iOS
            artifact_path: LiAutoMonitor.ipa
            asset_name: LiAutoMonitor.ipa
          - os: ubuntu-latest
            target: Linux
            artifact_path: build/linux/x64/release/bundle/
            asset_name: LiAutoMonitor-Linux.tar.gz
          - os: windows-latest
            target: Windows
            artifact_path: build/windows/x64/runner/Release/
            asset_name: LiAutoMonitor-Windows.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux Dependencies
        if: matrix.target == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        if: matrix.target == 'Android'
        run: flutter build apk --release

      - name: Build iOS IPA (unsigned)
        if: matrix.target == 'iOS'
        run: |
          flutter build ios --release --no-codesign
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r LiAutoMonitor.ipa Payload
          rm -rf Payload

      - name: Build Linux App
        if: matrix.target == 'Linux'
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release
          tar -czvf LiAutoMonitor-Linux.tar.gz -C build/linux/x64/release/bundle .

      - name: Build Windows App
        if: matrix.target == 'Windows'
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath LiAutoMonitor-Windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-Artifact
          # Use a conditional path based on the target to pick the right file
          path: |
            ${{ matrix.target == 'Android' && 'build/app/outputs/flutter-apk/app-release.apk' || '' }}
            ${{ matrix.target == 'iOS' && 'LiAutoMonitor.ipa' || '' }}
            ${{ matrix.target == 'Linux' && 'LiAutoMonitor-Linux.tar.gz' || '' }}
            ${{ matrix.target == 'Windows' && 'LiAutoMonitor-Windows.zip' || '' }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Android-Artifact/app-release.apk
            artifacts/iOS-Artifact/LiAutoMonitor.ipa
            artifacts/Linux-Artifact/LiAutoMonitor-Linux.tar.gz
            artifacts/Windows-Artifact/LiAutoMonitor-Windows.zip
          name: Release ${{ github.ref_name }}
          body: |
            Автоматическая сборка Li Auto Monitor.
            
            ### Артефакты:
            - 📱 **Android**: `app-release.apk`
            - 🍏 **iOS**: `LiAutoMonitor.ipa` (unsigned)
            - 🐧 **Linux**: `LiAutoMonitor-Linux.tar.gz`
            - 💻 **Windows**: `LiAutoMonitor-Windows.zip`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
