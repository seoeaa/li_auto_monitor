name: CI

on:
  push:
    branches:
      - v1.1-smart-diagnostics
  pull_request:
    branches:
      - master

jobs:
  flutter-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build Android debug
        run: flutter build apk --debug
