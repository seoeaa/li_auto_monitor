name: li_auto_monitor
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  dart_ping: ^9.0.1
  html: ^0.15.6
  provider: ^6.1.5+1
  intl: ^0.20.2
  path_provider: ^2.1.5
  file_picker: ^10.3.10
  url_launcher: ^6.3.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21 # android min sdk must be 21 or higher

flutter:
  uses-material-design: true
